<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Razan Marref</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050108;
      --panel-dark: #120820;
      --panel-soft: #1b102b;

      --accent: #d99cff;
      --accent-strong: #ff8bd5;
      --accent-two: #ffb347;

      --text-main: #fdf9ff;
      --text-muted: #c4b5f5;

      --shadow-soft: 0 26px 60px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;

      background-color: #020617;
      background-image:
        radial-gradient(circle at 0% 0%, #1d0440 0, transparent 50%),
        radial-gradient(circle at 100% 0%, #0f766e33 0, transparent 55%),
        radial-gradient(circle at 0% 100%, #7c2d1222 0, transparent 55%),
        linear-gradient(135deg, #020617 0, #030712 40%, #020617 100%);

      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at 0% 0%, #a855f7 0, transparent 55%),
        radial-gradient(circle at 100% 100%, #ec4899 0, transparent 55%);
      opacity: 0.22;
      filter: blur(18px);
      animation: float-blobs 18s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: -2;
    }

    @keyframes float-blobs {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(4%, 3%) scale(1.08); }
      100% { transform: translate(-3%, -2%) scale(1); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(18, 8, 32, 0.85);
      border: 1px solid rgba(217, 156, 255, 0.25);
      border-radius: 24px;
      padding: 48px 44px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      animation: pop-in 0.6s ease;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 0 0 6px rgba(217, 156, 255, 0.12), 0 12px 30px rgba(217, 156, 255, 0.35);
    }

    .icon-wrap svg {
      width: 34px;
      height: 34px;
      stroke: #1b102b;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #1b102b;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 26px rgba(217, 156, 255, 0.35);
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(217, 156, 255, 0.5);
    }

    .signature {
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--accent-two);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>
    <h1>Message Sent!</h1>
    <p>
      Thank you for reaching out. Your message has been received and I'll get back to you as soon as possible.
    </p>
   <a class="btn-main" href="/My-portfolio/">← Back to Portfolio</a>

    <div class="signature">Razan Marref · ML Engineer &amp; AI for Healthcare</div>
  </div>
</body>
</html>
